name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs obsoletos do mesmo ref (evita fila e ruído em pushes seguidos)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Privilégio mínimo: o workflow só precisa ler o repositório
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fixado na mesma versão do `packageManager` para build reprodutível
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      # `.nvmrc` é a fonte única da verdade da versão do Node
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # O build só compila: sem isto, um `dist/` vazio ou quebrado passaria
      - name: Smoke test built API artifact
        run: node --input-type=module -e "await import('./apps/api/dist/db/prisma.js')"

      - name: Test
        run: pnpm test
