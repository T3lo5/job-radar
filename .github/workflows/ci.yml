name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Tags de release também passam pelo CI: garante que o que vira
    # versão está verde (foi assim que o typecheck quebrou sem ninguém ver).
    tags: ['v*']

# Cancela runs obsoletos do mesmo ref (evita fila e ruído em pushes seguidos)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Privilégio mínimo: o workflow só precisa ler o repositório
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    # Os testes de integração da coleta rodam contra Postgres de verdade: eles
    # verificam o que uma dupla não reproduz — enum do banco, constraint
    # @unique, `skipDuplicates` sob concorrência. Sem o serviço, o teste falha
    # em vez de pular: pular seria CI verde sem verificar nada.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_test

    steps:
      - uses: actions/checkout@v4

      # Fixado na mesma versão do `packageManager` para build reprodutível
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      # `.nvmrc` é a fonte única da verdade da versão do Node
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sem isto o typecheck quebra em clone fresco com dezenas de
      # "Cannot find module '../generated/prisma'" + cascata de implicit-any:
      # o cliente Prisma é gerado (gitignored) e o `dist` do shared não vem
      # no checkout. Localmente o dev-up.sh já gera; no CI precisa ser passo.
      - name: Generate Prisma client
        run: pnpm --filter @job-radar/api exec prisma generate

      - name: Build shared package
        run: pnpm --filter @job-radar/shared build

      - name: Migrate test database
        run: pnpm --filter @job-radar/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # O build só compila: sem isto, um `dist/` vazio ou quebrado passaria
      - name: Smoke test built API artifact
        run: node --input-type=module -e "await import('./apps/api/dist/db/prisma.js')"

      - name: Test
        run: pnpm test

  # Gate de segurança: falha se houver vulnerabilidades de nível high ou
  # acima. Relatório salvo como artefato para inspeção.
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nível `high` começa informativo: exibe o relatório e publica o
      # artefato, mas não bloqueia. Após 1 semana, remover o `|| true` para
      # tornar o gate bloqueante (critério de aceite: PR com vulnerabilidade
      # high falha no CI).
      - name: Run pnpm audit
        id: audit
        run: |
          set +e
          pnpm audit --audit-level high --json > audit-report.json || true
          echo "audit_failed=$?" >> $GITHUB_OUTPUT
          cat audit-report.json

      - name: Publish audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit-report
          path: audit-report.json
          retention-days: 7

      - name: Fail on high vulnerabilities
        if: steps.audit.outputs.audit_failed != '0'
        run: |
          echo "::warning::pnpm audit encontrou vulnerabilidades de nível high ou acima."
          echo "Veja o artefato pnpm-audit-report para detalhes e justifique exceções em docs/."
          exit 1

  # Gate de integridade do schema: falha se schema.prisma e as migrations
  # divergerem (alterar schema sem migration bloqueia o CI).
  drift-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @job-radar/api exec prisma generate

      # `migrate diff` compara o estado atual das migrations contra o
      # datamodel do schema.prisma. Com --exit-code, qualquer divergência
      # retorna código != 0 e falha o job. Precisa de um shadow database
      # temporário para comparar contra as migrations.
      - name: Check schema vs migrations drift
        env:
          SHADOW_DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_shadow
        run: pnpm --filter @job-radar/api exec prisma migrate diff \
          --from-migrations prisma/migrations \
          --to-schema-datamodel prisma/schema.prisma \
          --shadow-database-url "${SHADOW_DATABASE_URL}" \
          --exit-code \
          --script

  # Job que aplica migrations do zero em Postgres limpo antes dos testes,
  # garantindo que o banco parte de um estado conhecido e consistente.
  migrations-clean:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar_clean
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar_clean"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobradar:jobradar@localhost:5433/jobradar_clean

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @job-radar/api exec prisma generate

      # Aplica todas as migrations do zero no banco limpo. Se alguma migration
      # estiver quebrada ou faltar, este job falha antes mesmo dos testes.
      - name: Deploy migrations on clean database
        run: pnpm --filter @job-radar/api exec prisma migrate deploy
